<div class="card shadow-sm mb-4">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h2 class="mb-0"><i class="fa fa-users me-2"></i>Personas</h2>
        <a routerLink="/personas/new" class="btn btn-success btn-sm">
            <i class="fa fa-plus me-1"></i>Nueva persona
        </a>
    </div>

    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col"></th>
                        <th scope="col">DNI</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellido</th>
                        <th scope="col">CUIL</th>
                        <th scope="col">Título</th>
                        <th scope="col" class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let persona of resultsPage.content; index as i">
                        <td>{{ (resultsPage.number * resultsPage.size) + i + 1 }}</td>
                        <td>{{ persona.dni }}</td>
                        <td>{{ persona.nombre }}</td>
                        <td>{{ persona.apellido }}</td>
                        <td>{{ persona.cuil }}</td>
                        <td>{{ persona.titulo }}</td>
                        <td class="text-end">
                            <a routerLink="/personas/{{ persona.dni }}" class="btn btn-sm btn-outline-primary me-1"
                                title="Editar">
                                <i class="fa fa-pencil"></i>
                            </a>
                            <a (click)="remove(persona.dni)" [routerLink]="" class="btn btn-sm btn-outline-danger"
                                title="Eliminar">
                                <i class="fa fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr *ngIf="!resultsPage.content || resultsPage.content.length === 0">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="fa fa-info-circle me-2"></i>No hay personas registradas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card-footer bg-light" *ngIf="resultsPage.numberOfElements > 0">
        <app-pagination [totalPages]="resultsPage.totalPages" [currentPage]="currentPage"
            (pageChangeRequested)="onPageChangeRequested($event)" [number]="resultsPage.number">
        </app-pagination>
    </div>
</div>
