<div *ngIf="division" class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h2 class="mb-0"><i class="fa fa-layer-group me-2"></i>{{ tituloFormulario }}</h2>
    </div>

    <div class="card-body">
        <form #form="ngForm" class="row g-3">
            <!-- Primera fila: Año y Número -->
            <div class="col-md-6 mb-3">
                <label for="anio" class="form-label text-primary fw-bold">Año</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar"></i>
                    </span>
                    <input id="anio" name="anio" type="text" placeholder="Ingrese año" class="form-control"
                        oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length > 2) this.value = this.value.slice(0,2);"
                        [(ngModel)]="division.anio" required #anio="ngModel" />
                </div>
                <div *ngIf="anio.invalid && (anio.dirty || anio.touched)" class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>El año es requerido
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="numDivision" class="form-label text-primary fw-bold">Número</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-hashtag"></i>
                    </span>
                    <input id="numDivision" name="numDivision" type="text" placeholder="Ingrese número"
                        class="form-control"
                        oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length > 2) this.value = this.value.slice(0,2);"
                        [(ngModel)]="division.numDivision" required #numDivision="ngModel" />
                </div>
                <div *ngIf="numDivision.invalid && (numDivision.dirty || numDivision.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>El número es requerido
                </div>
            </div>

            <!-- Segunda fila: Orientación y Turno -->
            <div class="col-md-6 mb-3">
                <label for="orientacion" class="form-label text-primary fw-bold">Orientación</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-graduation-cap"></i>
                    </span>
                    <input id="orientacion" name="orientacion" placeholder="Ingrese orientación" class="form-control"
                        [(ngModel)]="division.orientacion" required #orientacion="ngModel" />
                </div>
                <div *ngIf="orientacion.invalid && (orientacion.dirty || orientacion.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>La orientación es requerida
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="turno" class="form-label text-primary fw-bold">Turno</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-clock"></i>
                    </span>
                    <select id="turno" name="turno" class="form-select" [(ngModel)]="division.turno" required
                        #turno="ngModel">
                        <option *ngFor="let turnoValue of turnos" [ngValue]="turnoValue">
                            {{ getTurnoDisplay(turnoValue) }}
                        </option>
                    </select>
                </div>
                <div *ngIf="turno.invalid && (turno.dirty || turno.touched)" class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>El turno es requerido
                </div>
            </div>
        </form>
    </div>

    <div class="card-footer bg-light text-end">
        <button (click)="goBack()" class="btn btn-outline-secondary me-2">
            <i class="fa fa-arrow-left me-1"></i>Cancelar
        </button>
        <button (click)="save()" class="btn btn-success" [disabled]="form.invalid">
            <i class="fa fa-save me-1"></i>Guardar
        </button>
    </div>
</div>
