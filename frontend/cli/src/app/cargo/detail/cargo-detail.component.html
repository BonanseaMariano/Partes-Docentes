<div *ngIf="cargo" class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h2 class="mb-0"><i class="fa fa-briefcase me-2"></i>{{ tituloFormulario }}</h2>
    </div>

    <div class="card-body">
        <form #form="ngForm" class="row g-3">
            <!-- Primera fila: Nombre -->
            <div class="col-md-12 mb-3">
                <label for="nombre" class="form-label text-primary fw-bold">Nombre</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-tag"></i>
                    </span>
                    <input id="nombre" name="nombre" type="text" placeholder="Ingrese nombre del cargo"
                        class="form-control" [(ngModel)]="cargo.nombre" required #nombre="ngModel" />
                </div>
                <div *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>El nombre es requerido
                </div>
            </div>

            <!-- Segunda fila: Carga Horaria -->
            <div class="col-md-12 mb-3">
                <label for="cargaHoraria" class="form-label text-primary fw-bold">Carga Horaria</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-clock"></i>
                    </span>
                    <input id="cargaHoraria" name="cargaHoraria" type="text" placeholder="Ingrese carga horaria"
                        class="form-control" oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                        [(ngModel)]="cargo.cargaHoraria" required #cargaHoraria="ngModel" />
                </div>
                <div *ngIf="cargaHoraria.invalid && (cargaHoraria.dirty || cargaHoraria.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>La carga horaria es requerida
                </div>
            </div>

            <!-- Tercera fila: Tipo -->
            <div class="col-md-12 mb-3">
                <label for="tipoDesignacion" class="form-label text-primary fw-bold">Tipo</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-list"></i>
                    </span>
                    <select id="tipoDesignacion" name="tipoDesignacion" class="form-select"
                        [(ngModel)]="cargo.tipoDesignacion" required #tipoDesignacion="ngModel">
                        <option *ngFor="let tipo of tiposDesignacion" [ngValue]="tipo">
                            {{ getTipoDisplay(tipo) }}
                        </option>
                    </select>
                </div>
                <div *ngIf="tipoDesignacion.invalid && (tipoDesignacion.dirty || tipoDesignacion.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>El tipo es requerido
                </div>
            </div>

            <!-- Cuarta fila: División (si es necesario) -->
            <div class="col-md-12 mb-3">
                <label for="division" class="form-label text-primary fw-bold">División</label>
                <div class="row g-2">
                    <!-- Campo de Orientación con typeahead -->
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="fa fa-layer-group"></i>
                            </span>
                            <input id="division" name="division" type="text" placeholder="Buscar por orientación..."
                                class="form-control" [(ngModel)]="divisionSeleccionada" [ngbTypeahead]="searchDivision"
                                [resultFormatter]="resultDivisionFormat" [inputFormatter]="inputDivisionFormat"
                                (selectItem)="seleccionarDivision($event.item)" />
                        </div>
                        <output *ngIf="searching" class="spinner-border spinner-border-sm text-primary mt-1"
                            aria-live="polite">
                            <span class="visually-hidden">Buscando...</span>
                        </output>
                        <div *ngIf="searchFailed" class="text-danger small mt-1">
                            <i class="fa fa-exclamation-circle me-1"></i>Error al buscar divisiones
                        </div>
                    </div>

                    <!-- Campo de Año (solo lectura) -->
                    <div class="col-md-2" *ngIf="cargo.division?.anio">
                        <div class="input-group">
                            <span class="input-group-text bg-secondary text-white">
                                <i class="fa fa-calendar-alt"></i>
                            </span>
                            <input type="text" class="form-control" placeholder="Año"
                                [value]="cargo.division?.anio + '°'" readonly />
                        </div>
                    </div>

                    <!-- Campo de Número (solo lectura) -->
                    <div class="col-md-2" *ngIf="cargo.division?.numDivision">
                        <div class="input-group">
                            <span class="input-group-text bg-secondary text-white">
                                <i class="fa fa-hashtag"></i>
                            </span>
                            <input type="text" class="form-control" placeholder="Número"
                                [value]="cargo.division?.numDivision + '°'" readonly />
                        </div>
                    </div>

                    <!-- Campo de Turno (solo lectura) -->
                    <div class="col-md-2" *ngIf="cargo.division?.turno">
                        <div class="input-group">
                            <span class="input-group-text bg-secondary text-white">
                                <i class="fa fa-clock"></i>
                            </span>
                            <span class="form-control px-3 d-flex align-items-center justify-content-center" [ngClass]="{
                                    'bg-info text-dark': cargo.division?.turno === turnoEnum.MANIANA,
                                    'bg-warning text-dark': cargo.division?.turno === turnoEnum.TARDE,
                                    'bg-secondary text-white': cargo.division?.turno === turnoEnum.VESPERTINO,
                                    'bg-dark text-white': cargo.division?.turno === turnoEnum.NOCHE
                                  }">
                                {{ cargo.division?.turno }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quinta fila: Vigencia Desde -->
            <div class="col-md-6 mb-3">
                <label for="fechaInicio" class="form-label text-primary fw-bold">Vigencia Desde</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar-plus"></i>
                    </span>
                    <input id="fechaInicio" name="fechaInicio" class="form-control" placeholder="dd/mm/yyyy"
                        [(ngModel)]="fechaInicioDate" [startDate]="fechaInicioDate || calendar.getToday()" ngbDatepicker
                        #fechaInicioPicker="ngbDatepicker" required #fechaInicio="ngModel" />
                    <button class="btn btn-outline-secondary calendar" (click)="fechaInicioPicker.toggle()"
                        type="button">
                        <i class="fa fa-calendar"></i>
                    </button>
                </div>
                <div *ngIf="fechaInicio.invalid && (fechaInicio.dirty || fechaInicio.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>La fecha de inicio es requerida
                </div>
            </div>

            <!-- Sexta fila: Vigencia Hasta -->
            <div class="col-md-6 mb-3">
                <label for="fechaFin" class="form-label text-primary fw-bold">Vigencia Hasta</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar-minus"></i>
                    </span>
                    <input id="fechaFin" name="fechaFin" class="form-control" placeholder="dd/mm/yyyy"
                        [(ngModel)]="fechaFinDate" [startDate]="fechaFinDate || fechaInicioDate || calendar.getToday()"
                        ngbDatepicker #fechaFinPicker="ngbDatepicker" #fechaFin="ngModel" />
                    <button class="btn btn-outline-secondary calendar" (click)="fechaFinPicker.toggle()" type="button">
                        <i class="fa fa-calendar"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="card-footer bg-light text-end">
        <button (click)="goBack()" class="btn btn-outline-secondary me-2">
            <i class="fa fa-arrow-left me-1"></i>Cancelar
        </button>
        <button (click)="save()" class="btn btn-success" [disabled]="form.invalid">
            <i class="fa fa-save me-1"></i>Guardar
        </button>
    </div>
</div>
