<div class="card shadow-sm mb-4">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h2 class="mb-0"><i class="fa fa-layer-group me-2"></i>Divisiones</h2>
        <a routerLink="/divisiones/new" class="btn-nuevo">
            <i class="fa fa-plus"></i>Nueva división
        </a>
    </div>

    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col"></th>
                        <th scope="col">Año</th>
                        <th scope="col">Número</th>
                        <th scope="col">Orientación</th>
                        <th scope="col">Turno</th>
                        <th scope="col" class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let division of resultsPage.content; index as i">
                        <td>{{ (resultsPage.number * resultsPage.size) + i + 1 }}</td>
                        <td>{{ division.anio }}°</td>
                        <td>{{ division.numDivision }}°</td>
                        <td>{{ division.orientacion }}</td>
                        <td>
                            <span class="badge fs-6 px-3 py-2" [ngClass]="{
                                    'bg-info text-dark': division.turno === turnoEnum.MANIANA,
                                    'bg-warning text-dark': division.turno === turnoEnum.TARDE,
                                    'bg-secondary text-white': division.turno === turnoEnum.VESPERTINO,
                                    'bg-dark text-white': division.turno === turnoEnum.NOCHE
                                  }">
                                {{ division.turno }}
                            </span>
                        </td>
                        <td class="text-end">
                            <a routerLink="/divisiones/{{ division.id }}" class="btn btn-sm btn-outline-primary me-1"
                                title="Editar">
                                <i class="fa fa-pencil"></i>
                            </a>
                            <a (click)="remove(division.id)" [routerLink]="" class="btn btn-sm btn-outline-danger"
                                title="Eliminar">
                                <i class="fa fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr *ngIf="!resultsPage.content || resultsPage.content.length === 0">
                        <td colspan="6" class="empty-state-cell">
                            <i class="fa fa-info-circle me-2"></i>No hay divisiones registradas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card-footer bg-light" *ngIf="resultsPage.numberOfElements > 0">
        <app-pagination [totalPages]="resultsPage.totalPages" [currentPage]="currentPage"
            (pageChangeRequested)="onPageChangeRequested($event)" [number]="resultsPage.number">
        </app-pagination>
    </div>
</div>
