<div *ngIf="designacion" class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h2 class="mb-0"><i class="fa fa-user-tie me-2"></i>{{ tituloFormulario }}</h2>
    </div>

    <div class="card-body">
        <form #form="ngForm" class="row g-3">
            <!-- Primera fila: Persona -->
            <div class="col-12 mb-3">
                <label for="persona" class="form-label text-primary fw-bold">Persona</label>
                <div class="row g-2">
                    <!-- Campo de búsqueda de personas -->
                    <div class="col-md-12">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="fa fa-user"></i>
                            </span>
                            <input id="persona" name="persona" type="text"
                                placeholder="Buscar persona por dni, nombre o apellido..." class="form-control"
                                [ngClass]="{'is-invalid': persona.invalid && persona.touched && designacion.persona && !designacion.persona.id}"
                                [(ngModel)]="personaSeleccionada" [ngbTypeahead]="searchPersona"
                                [resultFormatter]="resultPersonaFormat" [inputFormatter]="inputPersonaFormat"
                                (selectItem)="seleccionarPersona($event.item)"
                                (ngModelChange)="onPersonaInputChange($event)" required #persona="ngModel" />
                        </div>
                        <div *ngIf="persona.invalid && persona.touched && designacion.persona && !designacion.persona.id"
                            class="text-danger small mt-1">
                            <i class="fa fa-exclamation-circle me-1"></i>Seleccione una persona
                        </div>
                    </div>
                </div>
            </div>

            <!-- Campos de información de la persona seleccionada -->
            <div *ngIf="designacion.persona && designacion.persona.dni" class="row mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-id-card"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="DNI" [value]="designacion.persona.dni"
                            readonly />
                    </div>
                    <small class="text-secondary">DNI</small>
                </div>

                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Nombre"
                            [value]="designacion.persona.nombre" readonly />
                    </div>
                    <small class="text-secondary">Nombre</small>
                </div>

                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Apellido"
                            [value]="designacion.persona.apellido" readonly />
                    </div>
                    <small class="text-secondary">Apellido</small>
                </div>
            </div>

            <!-- Segunda fila: Cargo -->
            <div class="col-12 mb-3">
                <label for="cargo" class="form-label text-primary fw-bold">Cargo</label>
                <div class="row g-2">
                    <!-- Campo de búsqueda de cargos -->
                    <div class="col-md-12">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="fa fa-briefcase"></i>
                            </span>
                            <input id="cargo" name="cargo" type="text"
                                placeholder="Buscar cargo por nombre, tipo, carga horaria o división..."
                                class="form-control"
                                [ngClass]="{'is-invalid': cargo.invalid && cargo.touched && designacion.cargo && !designacion.cargo.id}"
                                [(ngModel)]="cargoSeleccionado" [ngbTypeahead]="searchCargo"
                                [resultFormatter]="resultCargoFormat" [inputFormatter]="inputCargoFormat"
                                (selectItem)="seleccionarCargo($event.item)"
                                (ngModelChange)="onCargoInputChange($event)" required #cargo="ngModel" />
                        </div>
                        <div *ngIf="cargo.invalid && cargo.touched && designacion.cargo && !designacion.cargo.id"
                            class="text-danger small mt-1">
                            <i class="fa fa-exclamation-circle me-1"></i>Seleccione un cargo
                        </div>
                    </div>
                </div>
            </div>

            <!-- Información del cargo seleccionado -->
            <div *ngIf="designacion.cargo && designacion.cargo.tipoDesignacion" class="row mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-list"></i>
                        </span>
                        <span class="form-control px-3 d-flex align-items-center fw-bold text-white" [ngClass]="{
                                'bg-primary': designacion.cargo.tipoDesignacion === tipoDesignacionEnum.CARGO,
                                'bg-success': designacion.cargo.tipoDesignacion === tipoDesignacionEnum.ESPACIO_CURRICULAR
                              }">
                            {{ designacion.cargo.tipoDesignacion | tipoDesignacionFormat }}
                        </span>
                    </div>
                    <small class="text-secondary">Tipo</small>
                </div>

                <div class="col-md-4" *ngIf="designacion.cargo?.cargaHoraria">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-clock"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Carga Horaria"
                            [value]="designacion.cargo.cargaHoraria + ' hs.'" readonly />
                    </div>
                    <small class="text-secondary">Carga Horaria</small>
                </div>

                <!-- Información de la división (si el cargo tiene una asignada) -->
                <div class="col-md-4" *ngIf="designacion.cargo?.division">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-layer-group"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="División"
                            [value]="formatDivision(designacion.cargo.division)" readonly />
                    </div>
                    <small class="text-secondary">División</small>
                </div>
            </div>

            <!-- Tercera fila: Situación de revista -->
            <div class="col-md-12 mb-3">
                <label for="situacionRevista" class="form-label text-primary fw-bold">Situación de revista</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-file-contract"></i>
                    </span>
                    <input id="situacionRevista" name="situacionRevista" type="text"
                        placeholder="Ingrese situación de revista" class="form-control"
                        [(ngModel)]="designacion.situacionRevista" #situacionRevista="ngModel" />
                </div>
            </div>

            <!-- Cuarta fila: Fechas -->
            <div class="col-md-6 mb-3">
                <label for="fechaInicio" class="form-label text-primary fw-bold">Vigencia Desde</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar-plus"></i>
                    </span>
                    <input id="fechaInicio" name="fechaInicio" class="form-control" placeholder="dd/mm/yyyy"
                        [(ngModel)]="fechaInicioDate" [startDate]="fechaInicioDate || calendar.getToday()" ngbDatepicker
                        #fechaInicioPicker="ngbDatepicker" required #fechaInicio="ngModel"
                        (ngModelChange)="onDateChange()" />
                    <button class="btn btn-outline-secondary calendar" (click)="fechaInicioPicker.toggle()"
                        type="button">
                        <i class="fa fa-calendar"></i>
                    </button>
                </div>
                <div *ngIf="fechaInicio.invalid && (fechaInicio.dirty || fechaInicio.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>La fecha de inicio es requerida
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="fechaFin" class="form-label text-primary fw-bold">Vigencia Hasta</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar-minus"></i>
                    </span>
                    <input id="fechaFin" name="fechaFin" class="form-control" placeholder="dd/mm/yyyy"
                        [(ngModel)]="fechaFinDate" [startDate]="fechaFinDate || fechaInicioDate || calendar.getToday()"
                        ngbDatepicker #fechaFinPicker="ngbDatepicker" #fechaFin="ngModel"
                        (ngModelChange)="onDateChange()" />
                    <button class="btn btn-outline-secondary calendar" (click)="fechaFinPicker.toggle()" type="button">
                        <i class="fa fa-calendar"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="card-footer bg-light text-end">
        <button (click)="goBack()" class="btn btn-outline-secondary me-2">
            <i class="fa fa-arrow-left me-1"></i>Cancelar
        </button>
        <button (click)="save()" class="btn btn-success" [disabled]="!formularioValido">
            <i class="fa fa-save me-1"></i>Guardar
        </button>
    </div>
</div>
