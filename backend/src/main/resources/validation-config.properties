# Configuración de Validaciones de Licencias
# Este archivo permite configurar el orden y comportamiento de las validaciones
# sin necesidad de recompilar el código

# Orden de validaciones para licencias (separado por comas)
# Valores disponibles: fecha, designaciones, solapamiento, articulo
# El orden se ejecuta de izquierda a derecha
licencia.validation.order=fecha,designaciones,solapamiento,articulo

# Si debe parar en el primer error o acumular todos los errores
# true = para en el primer error, false = acumula todos los errores
licencia.validation.stopOnFirstError=true

