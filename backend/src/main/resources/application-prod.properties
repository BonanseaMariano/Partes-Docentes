# Configuración para producción
# DATABASE_URL será proporcionada por Render automáticamente
# La clase DatabaseConfig se encarga de convertirla al formato correcto

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Configuración del servidor
server.port=${PORT:8080}

# Variables de entorno para CORS
app.frontend.url=${FRONTEND_URL:https://partes-docentes.onrender.com}

# Logging
logging.level.unpsjb.labprog=INFO
logging.level.org.springframework.web=INFO
