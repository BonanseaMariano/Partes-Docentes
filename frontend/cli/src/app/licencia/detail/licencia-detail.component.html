<div *ngIf="licencia" class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h2 class="mb-0"><i class="fa fa-calendar-minus me-2"></i>{{ tituloFormulario }}</h2>
    </div>

    <div class="card-body">
        <form #form="ngForm" class="row g-3">
            <!-- Primera fila: Persona -->
            <div class="col-12 mb-3">
                <label for="persona" class="form-label text-primary fw-bold">Persona</label>
                <div class="row g-2">
                    <!-- Campo de búsqueda de personas -->
                    <div class="col-md-12">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="fa fa-user"></i>
                            </span>
                            <input #persona="ngModel" id="persona" name="persona" type="text" class="form-control"
                                [(ngModel)]="personaSeleccionada" [ngbTypeahead]="searchPersona"
                                [inputFormatter]="inputPersonaFormat" [resultFormatter]="resultPersonaFormat"
                                (selectItem)="seleccionarPersona($event.item)"
                                (input)="onPersonaInputChange($any($event).target.value)" required
                                placeholder="Buscar por DNI, nombre o apellido...">
                        </div>
                        <div *ngIf="persona.invalid && persona.touched && licencia.persona && !licencia.persona.id"
                            class="text-danger small mt-1">
                            <i class="fa fa-exclamation-circle me-1"></i>Debe seleccionar una persona válida
                        </div>
                    </div>
                </div>
            </div>

            <!-- Campos de información de la persona seleccionada -->
            <div *ngIf="licencia.persona && licencia.persona.dni" class="row mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-id-card"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="DNI" [value]="licencia.persona.dni"
                            readonly>
                    </div>
                    <small class="text-secondary">DNI</small>
                </div>

                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Nombre" [value]="licencia.persona.nombre"
                            readonly>
                    </div>
                    <small class="text-secondary">Nombre</small>
                </div>

                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Apellido"
                            [value]="licencia.persona.apellido" readonly>
                    </div>
                    <small class="text-secondary">Apellido</small>
                </div>
            </div>

            <!-- Segunda fila: Artículo de Licencia -->
            <div class="col-12 mb-3">
                <label for="articulo" class="form-label text-primary fw-bold">Artículo</label>
                <div class="row g-2">
                    <!-- Campo de búsqueda de artículos -->
                    <div class="col-md-12">
                        <div class="input-group">
                            <span class="input-group-text bg-primary text-white">
                                <i class="fa fa-file-alt"></i>
                            </span>
                            <input #articulo="ngModel" id="articulo" name="articulo" type="text" class="form-control"
                                [(ngModel)]="articuloSeleccionado" [ngbTypeahead]="searchArticuloLicencia"
                                [inputFormatter]="inputArticuloFormat" [resultFormatter]="resultArticuloFormat"
                                (selectItem)="seleccionarArticulo($event.item)"
                                (input)="onArticuloInputChange($any($event).target.value)" required
                                placeholder="Buscar por artículo o descripción...">
                        </div>
                        <div *ngIf="articulo.invalid && articulo.touched && licencia.articuloLicencia && !licencia.articuloLicencia.id"
                            class="text-danger small mt-1">
                            <i class="fa fa-exclamation-circle me-1"></i>Debe seleccionar un artículo válido
                        </div>
                    </div>
                </div>
            </div>

            <!-- Información del artículo seleccionado -->
            <div *ngIf="licencia.articuloLicencia && licencia.articuloLicencia.articulo" class="row mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-file-alt"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Artículo"
                            [value]="licencia.articuloLicencia.articulo" readonly>
                    </div>
                    <small class="text-secondary">Artículo</small>
                </div>

                <div class="col-md-8" *ngIf="licencia.articuloLicencia?.descripcion">
                    <div class="input-group">
                        <span class="input-group-text bg-secondary text-white">
                            <i class="fa fa-info-circle"></i>
                        </span>
                        <input type="text" class="form-control" placeholder="Descripción"
                            [value]="licencia.articuloLicencia.descripcion" readonly>
                    </div>
                    <small class="text-secondary">Descripción</small>
                </div>
            </div>

            <!-- Tercera fila: Fechas -->
            <div class="col-md-6 mb-3">
                <label for="fechaDesde" class="form-label text-primary fw-bold">Vigencia Desde</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar-alt"></i>
                    </span>
                    <input #fechaDesde="ngModel" id="fechaDesde" name="fechaDesde" class="form-control"
                        placeholder="dd/mm/yyyy" [(ngModel)]="fechaDesdeDate" ngbDatepicker
                        #fechaDesdePicker="ngbDatepicker" required (ngModelChange)="onDateChange()" />
                    <button class="btn btn-outline-secondary calendar" (click)="fechaDesdePicker.toggle()"
                        type="button">
                        <i class="fa fa-calendar-alt"></i>
                    </button>
                </div>
                <div *ngIf="fechaDesde.invalid && (fechaDesde.dirty || fechaDesde.touched)"
                    class="text-danger small mt-1">
                    <i class="fa fa-exclamation-circle me-1"></i>La fecha de inicio es requerida
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="fechaHasta" class="form-label text-primary fw-bold">Vigencia Hasta</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">
                        <i class="fa fa-calendar-alt"></i>
                    </span>
                    <input id="fechaHasta" name="fechaHasta" class="form-control" placeholder="dd/mm/yyyy"
                        [(ngModel)]="fechaHastaDate" ngbDatepicker #fechaHastaPicker="ngbDatepicker"
                        (ngModelChange)="onDateChange()" />
                    <button class="btn btn-outline-secondary calendar" (click)="fechaHastaPicker.toggle()"
                        type="button">
                        <i class="fa fa-calendar-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Cuarta fila: Certificado Médico -->
            <div class="col-md-12 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="certificadoMedico" name="certificadoMedico"
                        [(ngModel)]="licencia.certificadoMedico" (change)="onCertificadoMedicoChange()">
                    <label class="form-check-label text-primary fw-bold" for="certificadoMedico">
                        Presenta Certificado Médico
                    </label>
                </div>
            </div>
        </form>
    </div>

    <div class="card-footer bg-light text-end">
        <button (click)="goBack()" class="btn btn-outline-secondary me-2">
            <i class="fa fa-arrow-left me-1"></i>Cancelar
        </button>
        <button (click)="save()" class="btn btn-success" [disabled]="!formularioValido">
            <i class="fa fa-save me-1"></i>Guardar
        </button>
    </div>
</div>
