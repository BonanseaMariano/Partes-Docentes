# Configuración para producción
# Base de datos - usar variables de entorno
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER:APP}
spring.datasource.password=${DATABASE_PASSWORD:APP}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Configuración del servidor
server.port=${PORT:8080}

# Variables de entorno para CORS
app.frontend.url=${FRONTEND_URL:https://partes-docentes.onrender.com}

# Logging
logging.level.unpsjb.labprog=INFO
logging.level.org.springframework.web=INFO
